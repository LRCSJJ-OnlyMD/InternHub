# docker-compose.local.yml
# Use this for local development with a local PostgreSQL database

services:
  # Local PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: internhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: internhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: internhub-backend
    restart: unless-stopped
    environment:
      # Database Configuration - Local PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/internhub
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      
      # File Storage Configuration
      DOCUMENT_STORAGE_LOCATION: /internship-reports
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 10MB
      
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-your-very-secure-secret-key-change-this-in-production-minimum-256-bits}
      JWT_EXPIRATION: 86400000
      
      # Server Configuration
      SERVER_PORT: 8080
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      APP_FRONTEND_URL: http://localhost:4200
    volumes:
      - internship-reports:/internship-reports
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Angular Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_URL: http://localhost:8080/api
    container_name: internhub-frontend
    restart: unless-stopped
    environment:
      API_URL: http://localhost:8080/api
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Persistent volumes
volumes:
  postgres-data:
    driver: local
  internship-reports:
    driver: local
